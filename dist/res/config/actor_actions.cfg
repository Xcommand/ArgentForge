// one line each, short enough for a calltip: what calling it does
descriptions
{
	A_Stop = "Kills all three of the actor's velocity numbers, so it stops dead where the state asked.";
	A_ScaleVelocity = "Multiplies the velocity the actor already has by the number given: 0.5 for half as fast, 2 for twice, 0 to stop it.";
	A_SetMass = "Sets the actor's mass, which is what decides how far a kick or an explosion can throw it.";
	A_JumpIfHigherOrLower = "Goes to the first label when the actor named is above you, the second when it's below.";
	A_FindTracer = "Looks for something to chase when the actor has no tracer yet.";
	A_ClearTracer = "Forgets the tracer, which is the actor a seeking missile follows.";
	A_NoiseAlert = "Makes noise about the target so the monsters nearby wake up to it.";
	A_WeaponAlert = "Wakes the monsters to the player holding this weapon.";
	A_CheckForReload = "Counts the shots a weapon fires up to the number given and reloads when the count wraps.";
	A_ResetReloadCounter = "Sets the shot count A_CheckForReload keeps back to the start again.";
	A_Fire = "Hops the caller along in front of its tracer, for as long as the target can still be seen.";
	A_BFGSpray = "Fires a fan of rays at the target and spawns the spray actor wherever they land.";
	A_ThrowGrenade = "Spawns the missile class given and tosses it with the velocities you pass.";
	A_Blast = "Shoves everything within the radius away from the actor, at the strength and speed given.";
	A_Burnarea = "A_Explode with 128 damage and a 128 range, which is how Strife's phosphorous grenade burns.";
	A_PainShootSkull = "Spawns the skull class given off at an angle, unless there's no room overhead or too many alive.";
	A_KeenDie = "Once no live copy of its own class is left, switches on the line special with the tag given.";
	A_SkullPop = "Pops the head off: the chunk actor is spawned above and the player carries on inside it, with the old body left behind and no longer solid.";
	A_CustomPunch = "A melee hit straight ahead, with the damage, range, puff and lifesteal you choose.";
	A_Morph = "Turns the caller into the class given for the number of tics given.";
	A_LineEffect = "Runs a linedef special by its number, aimed at the sector tag given.";
}

// the ones the engine has stopped supporting, and what to call instead
replacements
{
	A_FaceConsolePlayer = "Empty in the engine and only here so an old Zandronum mod still loads.";
	A_BulletAttack = "A_CustomBulletAttack takes the same spread as arguments instead of from the actor.";
	A_PlaySound = "A_StartSound does this, with the channel and the rest as plain arguments.";
	A_PlayWeaponSound = "A_StartSound with CHAN_WEAPON as its channel.";
	A_PlaySoundEx = "A_StartSound covers what the extra arguments used to do.";
	A_StopSoundEx = "A_StopSound, told which channel to quiet.";
	A_ChangeFlag = "Give the flag itself in ZScript rather than calling something to do it.";
	A_CheckFlag = "Test the flag in an A_JumpIf expression, or send the actor to a label with SetStateLabel.";
	A_SetUserVar = "Writes one of the numbered slots an actor has. Declare a variable in ZScript and give it the value.";
	A_SetUserVarFloat = "The numbered slots again, for a slot holding a double.";
	A_SetUserArray = "Fills several numbered slots at once, which an actor's own array variable does better.";
	A_SetUserArrayFloat = "Several numbered slots at once, for doubles.";
	A_MeleeAttack = "CustomMeleeAttack, which takes the range and the damage as arguments.";
	A_MissileAttack = "A_SpawnProjectile.";
	A_ComboAttack = "A_BasicAttack on the weapon's own states.";
	CustomInventory.A_GunFlash = "This one starts a weapon's flash, so an inventory item can't run it.";
	CustomInventory.A_Lower = "Takes a weapon out of view, which is nothing an inventory item has.";
	CustomInventory.A_Raise = "Brings a weapon back into view, which is nothing an inventory item has.";
	CustomInventory.A_CheckReload = "Reloads a weapon; the copy on an inventory item was left empty.";
	CustomInventory.A_WeaponReady = "Holds a weapon up for the player, which an inventory item has none of.";
	A_CustomMissile = "A_SpawnProjectile, whose pitch counts the usual way round.";
	A_FireCustomMissile = "A_FireProjectile, which spends ammo the same way.";
}

// the longer say-so for the calls people actually use, the line the Actions page shows
notes
{
	A_JumpIfInventory = "Goes to the label when the actor carries at least the given amount of the item. An amount of 0 asks for a full stack instead, and the pointer at the end says whose inventory to look in.";
	A_TakeInventory = "Takes the amount given out of the actor's inventory, or the whole item when the amount is 0. Says false when the actor doesn't have the item at all.";
	A_GiveInventory = "Puts the item into the actor's inventory, just the one unless an amount says otherwise - a 0 counts as one. Says false if the actor won't take it.";
	A_SetInventory = "Sets how many of the item the actor has, exactly, instead of adding to or taking away from it. The last argument lets it go past the item's own limit.";
	A_Jump = "Goes to the label some of the time: the chance is a roll out of 256, so 128 jumps about half the time and 256 or more always jumps.";
	A_CustomMissile = "Spawns the projectile aimed the way the pointer's actor aims, its target by default. The pitch here counts the other way round to A_SpawnProjectile's.";
	A_FireCustomMissile = "Fires the projectile from a weapon, spending ammo unless told not to. Same arguments as A_FireProjectile but the pitch counts the other way round.";
	A_SpawnItem = "Drops an actor just in front of the caller and a little above the ground, the way Heretic's time bomb does. From a weapon state it spends a shot of ammo unless told not to.";
	A_SpawnItemEx = "The detailed version of A_SpawnItem: the offsets and the velocity are measured from the caller's own facing unless an SXF_ABSOLUTE flag asks for world coordinates, and sideways means the opposite way in those two modes. The fail chance is a roll out of 256.";
	A_WeaponReady = "Holds the weapon up and lets the player fire it, switch off it or reload it; the WRF_ flags say which of those to leave blocked. Only does anything in a weapon's own states.";
	A_WeaponOffset = "Moves the weapon picture on screen: the first number is sideways, the second one is height. WOF_ADD makes them add to where the weapon already is instead of replacing it, and WOF_KEEPX or WOF_KEEPY leaves one of the two alone.";
	A_GunFlash = "Starts the weapon's flash state, its AltFlash when it's the alternate fire, and makes the player's arm swing unless flag 1 says not to. Weapon states only.";
	A_ReFire = "Keeps the weapon firing while the fire button is held, running back through the flash state instead of lowering the gun. This is what makes a held trigger repeat.";
	A_Lower = "Takes the current weapon out of sight a few pixels per tic and brings the one the player picked in its place. Weapon states only.";
	A_Raise = "Brings the weapon the player switched to up into view, a few pixels per tic, and only hands over to its Ready state once it's all the way up. Weapon states only.";
	A_ZoomFactor = "Pulls the player's view in or out: 2 is twice as close, clamped between 0.1 and 50. Flag 1 snaps there instead of sliding, flag 2 stops the aim being slowed to match. Needs a player holding a weapon.";
	A_SetPitch = "Turns the view of the actor up or down by the angle given, in degrees. A player's view is clamped to what it can look at either way, flag 1 forces the same clamp on anything else, and flag 2 eases the change in rather than snapping.";
	A_SetRoll = "The same as A_SetPitch, for the sideways tilt of an actor or of a player's view.";
	A_SetAngle = "Turns the actor, or whoever the pointer names, to face the given angle in degrees. Flag 2 eases a player's turn instead of snapping it.";
	A_PlaySound = "The older of the two sound calls. The slot is one of the CHAN_ constants, and it defaults to CHAN_BODY.";
	A_SprayDecal = "Puts the named decal on whatever is in front of the actor, up to the given distance away.";
	A_Explode = "Does radius damage from the actor. Leaving damage at -1 takes the damage and the range from the actor's own ExplosionDamage and ExplosionRadius, and then whether it hurts the shooter comes from its DontHurtShooter flag rather than from the flags you pass; a range of 0 or less uses the damage number as the range instead. The XF_ flags say who it may reach, XF_HURTSOURCE asking for the caller to be included, and a nail count above 0 fires that many hitscan shots instead of the radius.";
	A_FadeIn = "Adds to the actor's alpha each tic its state runs, so the amount is per state tick and not per second. It goes past fully solid unless flag 2 (FTF_CLAMP) stops it at 1, and flag 1 takes the actor out of the game once it gets there.";
	A_FadeOut = "Takes alpha off each tic the state runs, 0.1 of it by default, which is per state tick rather than per second. The flags default to 1, so the actor is removed once it's fully invisible; pass 2 to clamp it at nothing and leave the actor there, or 0 to keep it fading below zero.";
	A_Print = "Writes a line across the middle of the screen. A name starting with $ is read as a game string, the second number is how many seconds it stays up (0 means the con_midtime setting), and the last one names a font. Only shows on the screen of whoever the local player is in - A_PrintBold is the one that prints for anyone.";
	A_FireProjectile = "Fires the given projectile from a player, and says nothing at all when the weapon is out of ammo. angle and pitch are degrees and the pitch here counts the other way round to A_SpawnProjectile's; spawnofs_xy shifts the spawn sideways and spawnheight up. Flag 1 (FPF_AIMATANGLE) fires where the angle points instead of turning the missile after it spawns.";
	A_JumpIf = "Goes to the label when the expression given for it comes out true, and carries on with the next state when it doesn't.";
	A_JumpIfCloser = "Goes to the label when the target is nearer than the distance given, in map units. For a player that's whatever the crosshair is on, so it needs to be aiming at something, and for anything else it's the actor's own target. It measures the gap between the top of one and the feet of the other unless the last argument says to ignore height, and a distance of exactly the number given doesn't count as closer.";
	A_JumpIfHealthLower = "Goes to the label when the health of the pointer, yourself by default, is under the number given. Under it, not equal to it.";
	A_JumpIfNoAmmo = "Goes to the label when the weapon the player is holding has nothing left to fire with, which is why it does nothing outside a weapon's own states. Infinite ammo, or the power-up for it, means it never goes.";
	A_Recoil = "Adds a shove to the actor's velocity, straight back from wherever it's facing, at the speed given in map units per tic. Only sideways movement, and it adds to what the actor was already doing rather than setting it.";
	A_CheckFloor = "Goes to the label when the actor is down at its floor height, and leaves it alone while it's still in the air.";
	A_ClearOverlays = "Turns off the overlays of the player holding this actor, all of them or just the layers between the two numbers you give. Layer 0 is left alone, and so are the weapon, flash and Strife-hands layers, which the last argument stops short of unless you tell it to go further. An actor no player is holding keeps everything as it is.";
	A_LookEx = "The looking-around half of a monster's brain, with the bounds given: the two sight distances are the map-unit range it may wake up in, maxheardist the range a sound wakes it in, and fov the arc it can see in degrees, where 0 means 180. The LOF_ flags take things away again - LOF_NOSIGHTCHECK skips the sight test, LOF_NOSOUNDCHECK the hearing, LOF_DONTCHASEGOAL the goal chasing and LOF_NOJUMP the move into its see state - and the label is where to go when it does see someone.";
	A_SelectWeapon = "Tells the player to change to the weapon class given. It goes onto the pending list, so the change happens after the state you called it from rather than in the middle of it, and it says false when the player isn't carrying that weapon. Flag 1 lets an empty choice mean the best weapon the player has.";
	A_RadiusGive = "Gives the item to everyone within the distance in map units and says how many it reached. The flags pick who counts (RGF_SELF, RGF_PLAYERS, RGF_MONSTERS, RGF_ITEMS and the rest), RGF_NOSIGHT ignores whether they can be seen, RGF_CUBE measures a box instead of a sphere and RGF_INCLUSIVE treats the pointer tests as or rather than and. An amount of 0 gives one of the item, the filter and species arguments narrow who qualifies and the last number caps how many get it.";
	A_PlaySoundEx = "The older sound call, from before the channel names were constants: the slot here is a name - Auto, Weapon, Voice, Item, Body or SoundSlot5 to 7 - and a name outside those lands in Auto. The last number is the attenuation, 0 being normal and 1 or 2 full volume. The engine says to use A_StartSound instead.";
	A_PlayWeaponSound = "A_StartSound on the weapon channel, at normal volume or at full volume when the second argument is true. The engine says to call A_StartSound with CHAN_WEAPON instead, and despite the name any actor can use it, not just a weapon.";
	A_SpawnDebris = "Throws pieces of the given actor out from the caller. How many come out is that class's own Health, each one lands at a small random offset and gets a random shove, with the third number scaling the sideways kick and the fourth the upward one; either of them at 0 or less counts as 1. True for the second argument puts each piece in the caller's translation, and a piece's frame is picked from its own states, so a multi-frame debris class shows the frames.";
	A_ChangeFlag = "Sets or clears a flag by its name written as text, which is how this was done before a flag could be assigned directly. The engine says to write bFlagName = true or false instead. A name that isn't a flag changes nothing and says so in the console.";
	A_SetMass = "For changing it mid-run: a Mass line in the defaults block says the same thing once and for all, so this is for the times an actor stops being what it was.";
	A_Stop = "More than three zeroes: when it stops a player this resets that player's movement and idle animation too, the way a player coming to a halt normally gets.";
	A_JumpIfHigherOrLower = "Either label can be left out to skip that test. The two offsets move the thresholds up and down from your own height, and the includeHeight flag, on by default, adds the caller's own height when looking above and the other actor's when looking below, so a tall one counts as higher than its feet. The pointer is the target by default, and pointing at yourself never jumps.";
	A_FindTracer = "It only looks while there is no tracer, so this starts a hunt rather than re-aiming an existing one. The distance is in 128 unit blocks rather than map units, and the field of view is the whole arc in degrees, which the engine halves before using it, with 0 looking all the way round.";
	A_NoiseAlert = "What it announces is the target rather than the caller, so an actor with no target says nothing at all.";
	A_WeaponAlert = "For a weapon with the WPF_SILENT flag, whose shots wake nobody: this calls attention to wherever the player holding it is standing.";
	A_CheckForReload = "The count is how many shots make a clip: it goes up each time this runs, and the state that lands on 0 lets the weapon reload - unless the ammo is gone, which it checks at that moment. Short of that it jumps to the label you give, which is where the firing frames belong. dontincrement reads the count without writing it back, for a state that only wants to look. It does nothing outside a weapon's own states.";
	A_Fire = "The Arch-Vile's flame walking along the floor behind its victim: the caller is moved to 24 units in front of its tracer, along the tracer's own aim, and stops moving once the target falls out of sight rather than walking through the wall. The number given lifts the flame off the ground.";
	A_BFGSpray = "The rays are spread over the angle you give, out to the distance, one per ray doing the damage count; the spray actor is spawned where each one lands. By default they come out of the target's position, and the BFGF_MISSILEORIGIN flag has them come from this actor instead, which is what a projectile firing the spray wants. With no target nothing happens.";
	A_CustomPunch = "The damage is rolled one to eight times over unless norandom says to take the number as written, and it goes in as Melee damage, so anything that shrugs that off shrugs it off. Ammo only spends when the hit connects and only from a weapon state. The lifesteal fraction gives the shooter health back, or armor with the CPF_STEALARMOR flag, up to the cap given; it turns to face what it hit unless CPF_NOTURN says otherwise; and nothing here knows about a berserk power-up, which is a job for A_CheckIfInventory and a stronger state.";
	A_KeenDie = "The live count is over actors of its own class, so two monsters sharing one class switch the tag together, and the tag itself defaults to 666 because that is what Doom II map 32 uses.";
	A_LineEffect = "The number is taken as a native special after translation, and a special that only fires once is remembered on the actor, so a state that runs every tic will not switch it again. Returns whether anything happened at all.";
}
