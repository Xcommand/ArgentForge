// Actor property vocabulary for the Actor Constructor
//
// The names come from the property lists of config/languages/decorate.txt and
// config/languages/zscript.txt, sorted into groups by what each one is for. Both
// actor formats get the same list, since it's the same engine vocabulary either
// way. A property that isn't listed here can still be typed in by hand.
properties
{
	General = { Tag, Obituary, HitObituary, Species, SpawnID, ConversationID, Game, Activation, DropItem, Args, ClearFlags, Monster, Projectile, Skip_Super }
	Health = { Health, GibHealth, WoundHealth, PainChance, PainThreshold, Threshold, DefThreshold, PainType, DeathType }
	Combat = { Accuracy, Stamina, ReactionTime, MeleeRange, MeleeDamage, MeleeThreshold, MaxTargetRange, FriendlySeeBlocks, MissileType, MissileHeight, MinMissileChance, MissileChanceMult, WeaveIndexXY, WeaveIndexZ, ProjectileKickBack, RipperLevel, RipLevelMin, RipLevelMax, ShadowAimFactor, ShadowPenaltyFactor, DistanceCheck }
	Damage = { Damage, DamageType, DamageFactor, DamageMultiply, RadiusDamageFactor, SelfDamageFactor, DontHurtShooter, ExplosionRadius, ExplosionDamage, PoisonDamage, PoisonDamageType }
	Physics = { Gravity, Mass, Radius, Height, Speed, VSpeed, FastSpeed, FloatSpeed, Friction, MaxStepHeight, MaxDropOffHeight, MaxSlopeSteepness, ThruBits, PushFactor, DeathHeight, BurnHeight, ProjectilePassHeight, CameraHeight, LandingSpeed, BounceType, BounceFactor, WallBounceFactor, BounceCount }
	Rendering = { RenderStyle, DefaultAlpha, Alpha, Scale, XScale, YScale, SpriteAngle, SpriteRotation, VisibleAngles, VisiblePitch, Translation, StencilColor, BloodColor, BloodType, Decal, LightLevel, RenderRadius, StealthAlpha, FloatBobPhase, FloatBobStrength, FloatBobFactor, CameraFOV }
	Sounds = { SeeSound, AttackSound, PainSound, DeathSound, ActiveSound, MeleeSound, HowlSound, BounceSound, WallBounceSound, CrushPainSound, RipSound, PushSound }
	Inventory = { Amount, MaxAmount, DefMaxAmount, InterHubAmount, Icon, AltHudIcon, PickupFlash, PickupMessage, PickupSound, PickupAnnouncerEntry, Respawntics, UseSound, GiveQuest, RestrictedTo, ForbiddenTo }
	Weapons = { Kickback, DefaultKickback, ReadySound, UpSound, SelectionOrder, SisterWeapon, YAdjust, AmmoGive, AmmoGive1, AmmoGive2, AmmoType, AmmoType1, AmmoType2, AmmoUse, AmmoUse1, AmmoUse2, BobStyle, BobSpeed, BobRangeX, BobRangeY, SlotNumber, SlotPriority, PreferredSkin, MinSelectionAmmo1, MinSelectionAmmo2, WeaponScaleX, WeaponScaleY, LookScale }
	Ammo = { BackpackAmount, BackpackMaxAmount, DropAmount }
	Armor = { SaveAmount, SavePercent, MaxAbsorb, MaxFullAbsorb, MaxSaveAmount, MaxBonus, MaxBonusMax }
	Powerups = { Color, Colormap, Duration, Mode, Strength, Type, MorphStyle, MorphFlash, UnmorphFlash, PlayerClass, MonsterClass }
	Players = { DisplayName, SoundClass, Face, ColorRange, ColorSet, ColorSetFile, ClearColorSet, AttackZOffset, JumpZ, ViewHeight, ForwardMove, SideMove, MaxHealth, MugshotMaxHealth, RunHealth, MorphWeapon, FlechetteType, ScoreIcon, CrouchSprite, DamageScreenColor, StartItem, InvulnerabilityMode, HealRadiusType, HexenArmor, Portrait, WeaponSlot, FallingScreamSpeed, GruntSpeed, AirCapacity, UseRange, ViewBob, ViewBobSpeed, TeleportFreezeTime, FlyBob, WaterClimbSpeed, SpawnClass }
	Puzzle = { Number, FailMessage, FailSound }
	Misc = { TeleFogSourceType, TeleFogDestType }
}

// One short line per property, shown when the mouse is over it in the
// constructor. A property that isn't listed here simply has no note.
descriptions
{
	Tag = "The short name shown for the actor, for instance when a player looks at a door it controls.";
	Obituary = "The death message printed when this actor kills a player. It is usually a language string.";
	HitObituary = "The death message printed when this actor kills a player with a melee hit.";
	Species = "Actors that share a Species count as the same kind, which is what the species flags look at.";
	SpawnID = "Makes the actor spawn with this TID, so scripted things can find it by number.";
	ConversationID = "The conversation this actor takes part in when the player talks to it.";
	Game = "Limits the actor to games that understand it, such as Doom or Strife.";
	Activation = "What has to happen before the actor's special runs, such as being touched or used.";
	DropItem = "An item this actor leaves behind when it dies, with the chance and amount after the name. Repeat the line for a list.";
	Args = "Up to five numbers the actor keeps for its scripts, written as a comma separated list.";
	ClearFlags = "Turns off flags the actor inherited from its parent, written as a list of flag names.";
	Monster = "Turns the actor into a monster in one line by setting the whole bundle of flags one needs.";
	Projectile = "The same shortcut for a projectile, setting the flags a shot needs.";
	Skip_Super = "Starts the actor from AActor's own defaults instead of its parent's, so it only keeps the states AActor itself has. It has to come before any state, and the class can't add variables of its own.";
	Health = "How much damage the actor takes before it dies.";
	GibHealth = "The health at which a hard hit sends the actor into its XDeath state instead of its normal death.";
	PainChance = "The chance that a hit makes the actor flinch, from 0 to 255. A monster needs more than zero to play its pain sound.";
	PainThreshold = "How much a single hit must do before the actor can flinch at all.";
	Threshold = "Damage the actor absorbs before any of it hurts, which refills over time.";
	DefThreshold = "The Threshold value the actor starts with and returns to.";
	DeathType = "The damage type this actor's own attacks kill with, which decides how the victim dies and what the kill message says. 'Normal' leaves it as the damage that was actually dealt.";
	Accuracy = "How tightly the monster's hitscan shots group together, from 0 to 255.";
	ReactionTime = "How long the monster waits between one decision and the next.";
	MeleeRange = "How close a target has to be before the melee attack can reach it.";
	MeleeDamage = "The damage the generic melee attacks deal.";
	MaxTargetRange = "How far away the monster will still look for a target.";
	MissileType = "The actor the monster fires for its missile attack.";
	MissileHeight = "How high above the floor the monster fires its missile from.";
	MinMissileChance = "The lowest chance the monster picks its missile attack instead of melee.";
	MissileChanceMult = "Multiplies how often the monster uses its missile attack, where 1 is normal.";
	DistanceCheck = "The name of a console variable holding a distance. The actor stops being drawn once the view is further away from the camera than that.";
	WeaveIndexXY = "How a missile weaves from side to side while it flies.";
	WeaveIndexZ = "How a missile weaves up and down while it flies.";
	ProjectileKickBack = "How hard the shot shoves whoever fired it backwards.";
	RipperLevel = "How many victims a ripping projectile can pass through.";
	Damage = "How much damage one hit from this attack deals.";
	DamageType = "The kind of damage this attack deals, which armour and damage factors can react to.";
	DamageFactor = "How much of a named damage type this actor takes, written as DamageFactor followed by the type and the amount.";
	DamageMultiply = "Multiplies all damage this actor takes by the given amount.";
	RadiusDamageFactor = "How much splash damage of a named type reaches this actor.";
	SelfDamageFactor = "How much of its own explosion damage this actor takes.";
	DontHurtShooter = "Stops this missile's splash damage from hurting whoever fired it.";
	ExplosionRadius = "How wide the explosion is that this actor makes.";
	ExplosionDamage = "How much damage that explosion deals at its centre.";
	PoisonDamage = "The damage dealt per tick to a victim this attack poisons.";
	PoisonDamageType = "The damage type of the poison this attack leaves on its victim.";
	Gravity = "The pull of gravity on the actor, where 1 is normal.";
	Mass = "How heavy the actor is, which decides how far a hit knocks it back.";
	Radius = "The actor's collision width.";
	Height = "The actor's collision height.";
	Speed = "How fast the actor travels, in map units per tic.";
	VSpeed = "The upward or downward speed a missile starts with.";
	FastSpeed = "The speed the actor moves at when the game is played on Fast Monsters.";
	FloatSpeed = "How quickly a FLOAT actor changes height to reach its target.";
	Friction = "How much the ground slows the actor down, where 1 is normal grip.";
	MaxStepHeight = "The tallest step the actor can walk up without jumping.";
	MaxDropOffHeight = "The tallest drop the actor will walk off by itself.";
	MaxSlopeSteepness = "The steepest slope the actor can still walk on.";
	ThruBits = "How far this actor's hitscan attacks reach through other actors. Needs the ALLOWTHRUBITS flag.";
	PushFactor = "How strongly this actor shoves others out of the way when it moves.";
	CameraHeight = "How far above the actor a camera looks from.";
	BounceType = "A shortcut for the bounce flags, picking the Heretic, Hexen or MBF style.";
	BounceFactor = "How much speed a missile keeps when it bounces off a floor.";
	WallBounceFactor = "How much speed it keeps when it bounces off a wall.";
	BounceCount = "How many times the missile may bounce before it dies.";
	RenderStyle = "How the actor is blended with what is behind it, for example Translucent or Add.";
	DefaultAlpha = "The transparency the actor starts with, from 0 to 1, for the styles that use it.";
	Alpha = "The actor's transparency right now, which scripts can change. DefaultAlpha is where it starts.";
	Scale = "Multiplies the size the actor is drawn at, where 1 is normal.";
	XScale = "Scales only the width the actor is drawn at.";
	YScale = "Scales only the height the actor is drawn at.";
	SpriteAngle = "The direction the sprite faces, no matter which way the actor looks. Needs the SPRITEANGLE flag.";
	SpriteRotation = "How many of the eight rotations the actor's artwork uses.";
	VisibleAngles = "Limits the angles the sprite is drawn at. Used with the MASKROTATION flag.";
	VisiblePitch = "Limits the pitches the sprite is drawn at. Used with the MASKROTATION flag.";
	Translation = "A colour translation applied to the actor's artwork, given as a palette or a colour range.";
	StencilColor = "The colour used by the Stencil and AddStencil render styles.";
	BloodColor = "The colour of the blood this actor bleeds.";
	BloodType = "The blood actor this one spawns when it is hurt.";
	Decal = "The mark this actor's attacks leave on walls instead of the default one.";
	LightLevel = "Makes the actor give off light at this level, or add to the sector's own with the ADDLIGHTLEVEL flag.";
	RenderRadius = "How wide the engine assumes the actor reaches when it decides whether to draw it.";
	StealthAlpha = "How see-through the actor is while the STEALTH flag is hiding it.";
	FloatBobPhase = "Where in its bobbing cycle the actor starts, so several of them don't move in step.";
	FloatBobStrength = "How wide the bobbing swing is.";
	FloatBobFactor = "Scales how fast a FLOATBOB actor bobs.";
	CameraFOV = "The field of view used when the actor is a camera.";
	SeeSound = "Played the moment the actor spots a target.";
	AttackSound = "Played when the actor attacks, where the attack asks for it.";
	PainSound = "Played when the actor is hurt.";
	DeathSound = "Played when the actor dies.";
	ActiveSound = "Played on a loop while the actor is awake and looking for something to do.";
	MeleeSound = "Played when the monster starts its melee attack.";
	BounceSound = "What a bouncing missile plays when it hits the floor, and on a wall too when WallBounceSound is left out.";
	WallBounceSound = "What a bouncing missile plays when it smacks into a wall instead of the floor.";
	CrushPainSound = "Played while the actor is being crushed to death.";
	RipSound = "Played when a ripping missile passes through a victim.";
	PushSound = "Played when something else shoves the actor along the floor.";
	Amount = "How much of this item one pickup gives the player.";
	MaxAmount = "The most of this item a player can carry.";
	DefMaxAmount = "The carry limit the item starts with, before anything changes it.";
	InterHubAmount = "How much of the item the player still has after a level change.";
	Icon = "The picture shown for the item on the HUD.";
	AltHudIcon = "The picture used by the alternative HUD instead of Icon.";
	PickupFlash = "The flash that fills the screen when the item is picked up.";
	PickupMessage = "The message printed when the item is picked up.";
	PickupSound = "The sound played when the item is picked up.";
	Respawntics = "How long the item waits before it reappears after someone takes it.";
	UseSound = "The sound played when the player uses the item.";
	GiveQuest = "The quest number the item marks as given when it is picked up.";
	RestrictedTo = "Only lets the named player classes use the item.";
	ForbiddenTo = "Stops the named player classes from using the item.";
	Kickback = "How much firing the weapon pushes the player's view up.";
	ReadySound = "Played when the player raises the weapon.";
	SelectionOrder = "The order weapons pick themselves when more than one of them could fire.";
	SisterWeapon = "The weapon this one switches to when its ammo runs out.";
	YAdjust = "Moves the weapon picture up or down on the screen.";
	AmmoGive = "How much ammo the weapon comes with when it is picked up.";
	AmmoGive1 = "How much of its first ammo type the weapon comes with.";
	AmmoGive2 = "How much of its second ammo type the weapon comes with.";
	AmmoType = "Which ammo the weapon uses.";
	AmmoType1 = "The ammo the weapon's first slot holds.";
	AmmoType2 = "The ammo the weapon's second slot holds.";
	AmmoUse = "How much ammo one shot costs.";
	AmmoUse1 = "How much ammo one shot takes from the first slot.";
	AmmoUse2 = "How much ammo one shot takes from the second slot.";
	BobStyle = "How the weapon swings while the player walks.";
	BobSpeed = "How fast the weapon swings.";
	BobRangeX = "How far the weapon swings sideways.";
	BobRangeY = "How far the weapon swings up and down.";
	SlotNumber = "The inventory slot the weapon sits in, from 0 to 5.";
	SlotPriority = "Which weapon the game reaches for first when two share a slot.";
	MinSelectionAmmo1 = "The least ammo in the first slot the weapon needs before it can be raised.";
	MinSelectionAmmo2 = "The least ammo in the second slot the weapon needs before it can be raised.";
	WeaponScaleX = "Scales the weapon picture sideways.";
	WeaponScaleY = "Scales the weapon picture up and down.";
	LookScale = "How far the view turns for each look movement while this weapon is out, where 1 is normal. It's for a weapon that zooms in, so turning doesn't come out too fast. Zero or negative leaves it alone.";
	BackpackAmount = "How much of this ammo a backpack adds to what the player carries.";
	BackpackMaxAmount = "The carry limit for this ammo once the player has a backpack.";
	DropAmount = "How many of these the player drops when they drop the ammo.";
	SaveAmount = "The part of the damage the armour soaks up, from 0 to 1.";
	SavePercent = "The percentage of incoming damage the armour takes instead of the player.";
	MaxAbsorb = "The most damage this armour piece can ever absorb.";
	MaxBonus = "The extra protection this armour adds to what the player's own armour can save.";
	MaxBonusMax = "The highest that extra from MaxBonus can add up to, however many of these are picked up.";
	Color = "The colour the powerup tints the screen with.";
	Colormap = "The colour map the powerup puts over the view instead of the level's own.";
	Duration = "How long the powerup lasts, in seconds.";
	Mode = "How the powerup's colour is laid over the view.";
	Strength = "How strong this powerup's effect is.";
	Type = "What kind of powerup this is, which decides how the engine handles it.";
	MorphFlash = "The actor spawned as the flash when the player morphs.";
	UnmorphFlash = "The actor spawned as the flash when the player changes back.";
	PlayerClass = "The player class a morph powerup turns the player into.";
	MonsterClass = "The monster class a morphed player turns into when they morph again.";
	DisplayName = "The name shown for the class in the menu and on the scoreboard.";
	SoundClass = "A class that holds the sounds this player makes, such as the landing grunt.";
	Face = "The face used on the HUD, given as the six pictures it is built from.";
	AttackZOffset = "How high above the player's feet a hitscan attack starts.";
	JumpZ = "The upward speed the player gets when jumping.";
	ViewHeight = "The height the player's eyes sit at.";
	ForwardMove = "The player's forward speed.";
	SideMove = "The player's sideways speed.";
	MaxHealth = "The most health this class can ever have.";
	MugshotMaxHealth = "The health at which the HUD face is drawn whole again.";
	MorphWeapon = "The weapon a morphed player is left holding.";
	FlechetteType = "The projectile thrown by the boots' flechette attack.";
	ScoreIcon = "The picture shown for the player's score.";
	CrouchSprite = "The sprite drawn instead of the player's while crouching.";
	DamageScreenColor = "The colour the screen flashes when the player is hurt.";
	StartItem = "An item the player begins the level with. Repeat the line for more than one.";
	HexenArmor = "The six Hexen-style armour values the class starts with.";
	Portrait = "The full-size picture shown for the class in the menu.";
	WeaponSlot = "Puts a weapon into one of the player's starting slots.";
	GruntSpeed = "The falling speeds at which the player grunts.";
	FallingScreamSpeed = "The falling speed at which the player screams.";
	AirCapacity = "How long the player can stay underwater, in seconds.";
	UseRange = "How far away the player can use a thing.";
	ViewBob = "How much the view swings while the player walks.";
	ViewBobSpeed = "How fast the view swings.";
	FlyBob = "How much the view swings while the player flies.";
	TeleportFreezeTime = "How long the player can't move after teleporting.";
	WaterClimbSpeed = "How fast the player climbs a wall while in water.";
	SpawnClass = "Which class group this player belongs to, given as Fighter, Cleric or Mage or as a number. Map items can be placed for one group only, and then the others never see them.";
	Number = "Which of the six puzzle item slots this one fills.";
	FailMessage = "The message shown when the puzzle item is used somewhere it doesn't fit.";
	FailSound = "The sound played when the puzzle item is used in the wrong place.";
	TeleFogSourceType = "The actor spawned as the fog where the player leaves on a teleport.";
	TeleFogDestType = "The actor spawned as the fog where the player arrives.";
	WoundHealth = "The health a monster is wounded at rather than killed: at this number or below it plays its Wound state instead of dying. Does nothing unless the actor has a Wound state. 6 by default.";
	PainType = "The damage type this actor's attacks count as when another actor picks which pain state to play. Normal by default.";
	Stamina = "Strife's extra hit points. The engine only reaches for it when a player morphs, where it is added to or taken off the health the morphed form gets, so it does nothing for a monster.";
	MeleeThreshold = "How close in map units a monster has to be before it leaves its missiles alone and uses its melee state. 0 by default, and nothing happens at all without a melee state.";
	FriendlySeeBlocks = "How far a friendly monster looks for something to shoot at, counted in blockmap blocks of 128 units, so 10 is around 1280 of them. 10 by default.";
	RipLevelMin = "The lowest ripper level that may hurt this actor: a ripping projectile under this flies past it. 0 means no minimum.";
	RipLevelMax = "The highest ripper level that may hurt this actor, 0 meaning no limit at the top. Neither one of them applies to an actor that is set not to be ripped.";
	ShadowAimFactor = "Scales how far a shot is thrown off by the random aim spread when a shadow actor is in the way. 1 by default leaves the spread as it is.";
	ShadowPenaltyFactor = "How strongly this actor, being a shadow one, spoils the aim of whoever is shooting at it. 1 by default.";
	DeathHeight = "The height the corpse is left at after an ordinary death, in map units, which is what you can then shoot over. -1, the default, keeps a quarter of the actor's own height.";
	BurnHeight = "The same, used instead of DeathHeight when the killing damage was fire.";
	ProjectilePassHeight = "How tall this actor counts for when a missile passes over it, in map units, so a low one can be flown over or a tall one hit. 0 leaves it at the actor's own height.";
	LandingSpeed = "The falling speed in map units per tic that counts as a hard landing, which is where the player's view squats down. -8 by default, about what a normal jump lands at. Negative because falling goes down.";
	HowlSound = "The sound a monster howls when it is electrocuted or killed by a poison cloud. Monsters only, and only about half the time.";
	DefaultKickback = "Takes the weapon's kickback from the game's own default instead of writing a number. It takes no value of its own, and weapons only.";
	UpSound = "The sound a weapon plays as the player raises it. Weapons only.";
	PreferredSkin = "Weapons only, and read by nothing: the engine keeps this name for Skulltag files and does nothing with it.";
	MaxFullAbsorb = "Armour only: how much of the damage it saves is absorbed at its full rate before it starts absorbing less.";
	MaxSaveAmount = "Armour only: the most a single pickup or bonus may add to the player's saved armour.";
	MorphStyle = "On a morphing projectile or power: which of the MORPH_ bits apply when a player morphs, such as refilling health or adding the stamina. The parts are written as names.";
	RunHealth = "Players only: the health at which the player can no longer run, at this number or below. 0 by default, which never stops a run.";
	InvulnerabilityMode = "Players only, and written as Player.InvulnerabilityMode: which kind of invulnerability the class gets when the power-up itself doesn't say, such as Ghost or Reflective.";
	HealRadiusType = "Players only, and written as Player.HealRadiusType: whether a healing radius restores health, armour or mana for this class.";
	PickupAnnouncerEntry = "Read by nothing: the engine keeps this name for Skulltag files and does nothing with it.";
	ColorRange = "Players only, and written as Player.ColorRange: the first and last colour numbers a player's skin may be recoloured through.";
	ColorSet = "Players only, and written as Player.ColorSet: adds one choice to the skin colour menu, given as its number, a name, the range it covers and a colour to show it by. One line per choice.";
	ColorSetFile = "The same as Player.ColorSet, except the colour range comes from a lump you name rather than from numbers, and a name that isn't in the file adds nothing. Players only.";
	ClearColorSet = "Players only: takes one of the colour choices a parent class added back out again, by its number.";
}

