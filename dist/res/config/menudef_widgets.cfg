// Menu widget vocabulary for the Menu Constructor
//
// Generated by scripts/gen/gen_menudef_widgets.js from the table that
// scripts/gen/gen_menudef_vocab.js scrapes out of the engine, so a keyword
// here is a keyword the parser really takes. Signatures are the argument
// lists of the widget classes, written the way the engine declares them.
//
// A word the file uses that is not in here is not an error: the engine
// looks a widget up as the class OptionMenuItem<word>, so mods add their
// own, and the constructor has to carry those lines through untouched.

// The words that open a block, by the body each one reads. The reader tells a
// widget from a menu setting by which of these the block is, and the
// constructor offers a new block out of the same list.
blocks
{
	optionmenu = { OPTIONMENU, ADDOPTIONMENU, DEFAULTOPTIONMENU }
	listmenu = { LISTMENU, ADDLISTMENU, DEFAULTLISTMENU }
	value = { OPTIONVALUE, OPTIONSTRING }
	settings = { OPTIONMENUSETTINGS }
	scroller = { IMAGESCROLLER }
	named = { LISTMENU, ADDLISTMENU, OPTIONVALUE, OPTIONSTRING, OPTIONMENU, ADDOPTIONMENU, IMAGESCROLLER }
}

// What each kind of block is for, shown where a new one is chosen
blocknotes
{
	OptionMenu = "A page of settings the player opens, holding the rows of options";
	AddOptionMenu = "Rows added into a page that already exists. The name has to be one the engine has seen, or it stops with an error";
	DefaultOptionMenu = "The fallback every settings page starts from: looks and spacing, and no rows";
	ListMenu = "A menu you place line by line and picture by picture, the way the original menus look";
	AddListMenu = "Lines added into a drawn menu that already exists, named here";
	DefaultListMenu = "The fallback every drawn menu starts from: looks and spacing, and no lines";
	OptionValue = "The list of values an Option steps through, one row per value, keyed by a number";
	OptionString = "The same list keyed by the text itself, for a setting stored as a string rather than a number";
	OptionMenuSettings = "How the settings pages are drawn: fonts, colours and spacing";
	ImageScroller = "A page of text and pictures that scrolls under itself, for credits and readmes";
}

// Words a menu body holds that are not widgets
menuwords
{
	optionmenu = { else, ifgame, ifnotgame, ifoption, Class, Title, Caption, Position, DefaultSelection, ScrollTop, Indent, AnimatedTransition, Animated, DontDim, DontBlur, TooltipFont, Tooltip }
	listmenu = { else, ifgame, ifnotgame, ifoption, Class, Selector, Linespacing, Position, Centermenu, Selecteditem, animatedtransition, animated, DontDim, DontBlur, MouseWindow, Font, TooltipFont, NetgameMessage, size, ForceList, CenterText, Tooltip }
	scroller = { else, ifgame, ifnotgame, ifoption, Class, animatedtransition, animated, DontDim, DontBlur, textBackground, textBackgroundBrightness, textScale, textFont }
	settings = { else, ifgame, ifnotgame, Linespacing, LabelOffset }
}

// Words the parser reads and then drops, so editing one changes nothing in the
// game. Saying so beats letting him tune a number that goes nowhere.
ignored = { Linespacing, LabelOffset }

// What a menu colour argument can name. The parser hands that argument to
// V_FindFontColor, which only knows a range out of the game TEXTCOLO lump, so a
// hex number there stops the file loading. Each name carries the colour it starts
// at, which is what lets the window show one and turn a picked colour back into a
// name.
colourranges
{
	all = { "Brick #A35C5C", "Tan #998B79", "Gray #8B8B8B", "Grey #8B8B8B", "Green #418B3B", "Brown #89735F", "Gold #B9953A", "Red #9F0000", "Blue #000093", "Orange #904000", "White #929292", "Yellow #3C3C3C", "Untranslated", "Black #323232", "LightBlue #5A5AB9", "Light Blue #5A5AB9", "Cream #6C472B", "Olive #494F2C", "DarkGreen #27551F", "Dark Green #27551F", "DarkRed #6D1616", "Dark Red #6D1616", "DarkBrown #614125", "Dark Brown #614125", "Purple #790079", "DarkGray #575757", "DarkGrey #575757", "Dark Gray #575757", "Dark Grey #575757", "Cyan #008888", "Ice #585874", "Fire #9E3B02", "Sapphire #2838B2", "Teal #124349" }
}

// What a value table holds per line, as the parser reads it
valuepair
{
	optionvalue = "number,'text'[,'tooltip']";
	optionstring = "'text','text'[,'tooltip']";
}

// The classes a Class line may name, checked the way the parser checks it: a
// descendant of the word below. One section per body with the body in its
// name, because a dotted name is two words to the resource reader.
menuclasses_listmenu
{
	all = { LoadMenu, LoadSaveMenu, PlayerMenu, SaveMenu }
}

menuclasses_optionmenu
{
	all = { ColorpickerMenu, CompatibilityMenu, GameplayMenu, GLTextureGLOptions, JoystickConfigMenu, NewPlayerMenu, os_Menu, ReverbEdit, ReverbSave, ReverbSelect, VideoModeMenu, VideoOptions }
}

menuclasses_scroller
{
	all = {  }
}

