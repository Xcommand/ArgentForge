// Actor flag vocabulary for the Actor Constructor
//
// The flag names come from the 'Actor flags (used in an actor's definition)'
// constants of config/languages/zscript.txt. The groups are categories of what
// the flags are for, curated in scripts/gen/gen_actor_flags.js, which regenerates this
// file and checks every real flag is in exactly one of them. Flags a file uses
// that aren't listed here still show up in the constructor.
flags
{
	Movement = { CANJUMP, CANNOTPUSH, CANPASS, CANPUSHWALLS, CANTLEAVEFLOORPIC, CANUSEWALLS, CEILINGHUGGER, CROSSLINECHECK, DONTFALL, DONTOVERLAP, DONTSQUASH, DONTTHRUST, DROPOFF, FALLDAMAGE, FLOAT, FLOATBOB, FLOORCLIP, FLOORHUGGER, GHOST, INFLOAT, JUMPDOWN, MOVEWITHSECTOR, MTHRUSPECIES, MVISBLOCKED, NOBLOCKMONST, NOCLIP, NODAMAGETHRUST, NODROPOFF, NOFORWARDFALL, NOFRICTION, NOFRICTIONBOUNCE, NOGRAVITY, NOLIFTDROP, PUSHABLE, RELATIVETOFLOOR, SLIDESONWALLS, SPAWNFLOAT, SPECIALFLOORCLIP, STAYONLIFT, THRUACTORS, THRUGHOST, THRUSPECIES, WINDTHRUST }
	Combat = { ALWAYSFAST, AMBUSH, AVOIDHAZARDS, AVOIDMELEE, BLASTED, BOSS, CANTSEEK, DONTFOLLOWPLAYERS, DONTSEEKINVISIBLE, FORCEINFIGHTING, FRIENDLY, FRIGHTENED, INCOMBAT, ISMONSTER, JUSTATTACKED, JUSTHIT, LOOKALLAROUND, MASTERNOSEE, MINVISIBLE, NEVERFAST, NEVERTARGET, NOFEAR, NOINFIGHTING, NOINFIGHTSPECIES, NOPAIN, NOSPLASHALERT, NOTARGET, NOTARGETSWITCH, NOTAUTOAIMED, NOVERTICALMELEERANGE, QUICKTORETALIATE, SCREENSEEKER, SEEFRIENDLYMONSTERS, SEEINVISIBLE, SEESDAGGERS, SKULLFLY, STANDSTILL, TELEPORT, TOUCHY, USESPECIAL }
	Damage = { ADDITIVEPOISONDAMAGE, ADDITIVEPOISONDURATION, ALLOWPAIN, ALWAYSTELEFRAG, BLOODLESSIMPACT, BUDDHA, CAUSEPAIN, DEFLECT, DOHARMSPECIES, DONTDRAIN, DONTGIB, DONTHARMCLASS, DONTHARMSPECIES, DONTRIP, DONTSPLASH, DOSHADOWBLOCK, EXTREMEDEATH, FOILBUDDHA, FOILINVUL, FORCEPAIN, FORCERADIUSDMG, FORCESECTORDAMAGE, FORCEZERORADIUSDMG, HARMFRIENDS, ICESHATTER, INVULNERABLE, LAXTELEFRAGDMG, MIRRORREFLECT, NOBLOOD, NOBOSSRIP, NODAMAGE, NOEXTREMEDEATH, NOICEDEATH, NONSHOOTABLE, NORADIUSDMG, NOSECTORDAMAGE, NOSHIELDREFLECT, NOTELEFRAG, NOTELESTOMP, NOTIMEFREEZE, OLDRADIUSDMG, PAINLESS, PIERCEARMOR, POISONALWAYS, REFLECTIVE, RIPPER, SHADOWBLOCK, SHIELDREFLECT, SMASHABLE, SPECTRAL, STRIFEDAMAGE, TELESTOMP, THRUREFLECT, VULNERABLE }
	Projectiles = { ACTIVATEIMPACT, ACTIVATEMCROSS, ACTIVATEPCROSS, AIMREFLECT, ALLOWTHRUBITS, ALWAYSPUFF, BLOCKEDBYSOLIDACTORS, CANBLAST, DEHEXPLOSION, DONTBLAST, DONTREFLECT, EXPLOCOUNT, MISSILE, NOEXPLODEFLOOR, ONLYSLAMSOLID, PUFFGETSOWNER, PUFFONACTORS, RETARGETAFTERSLAM, SEEKERMISSILE, SHADOWAIM, SHADOWAIMVERT, SKYEXPLODE, STEPMISSILE, STOPRAILS }
	Visual = { ABSMASKANGLE, ABSMASKPITCH, ADDLIGHTLEVEL, ALLOWPARTICLES, BILLBOARDFACECAMERA, BILLBOARDNOFACECAMERA, BLOODSPLATTER, BRIGHT, CASTSPRITESHADOW, DECOUPLEDANIMATIONS, DONTCORPSE, DONTFACETALKER, DONTFLIP, DONTINTERPOLATE, DONTTRANSLATE, FLATSPRITE, FLIPSPRITEOFFSETX, FLIPSPRITEOFFSETY, FORCEDECAL, FORCEXYBILLBOARD, FORCEYBILLBOARD, FRIGHTENING, FULLVOLACTIVE, FULLVOLDEATH, FULLVOLSEE, GRENADETRAIL, ICECORPSE, INTERPOLATEANGLES, INVISIBLE, INVISIBLEINMIRRORS, ISOMETRICSPRITES, MASKROTATION, NOBLOODDECALS, NODECAL, NOSKIN, NOSPRITESHADOW, NOTONAUTOMAP, ONLYVISIBLEINMIRRORS, ROCKETTRAIL, ROLLCENTER, ROLLSPRITE, SHADOW, SPRITEANGLE, SPRITEFLIP, SQUAREPIXELS, STEALTH, STRETCHPIXELS, VISIBILITYPULSE, WALLSPRITE, XFLIP, YFLIP, ZDOOMTRANS }
	Inventory = { DROPPED, NOMENU, PICKUP, WEAPONSPAWN }
	Players = { BLOCKASPLAYER, NOTDMATCH }
	Level = { ALWAYSRESPAWN, COUNTITEM, COUNTKILL, COUNTSECRET, E1M8BOSS, E2M8BOSS, E3M8BOSS, E4M6BOSS, E4M8BOSS, FIXMAPTHINGPOS, MAP07BOSS1, MAP07BOSS2, NEVERRESPAWN, NOTRIGGER, RANDOMIZE, SPAWNCEILING, SPAWNSOUNDSOURCE }
