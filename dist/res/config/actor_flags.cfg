	Bounce = { ALLOWBOUNCEONACTORS, BOUNCEAUTOOFF, BOUNCEAUTOOFFFLOORONLY, BOUNCELIKEHERETIC, BOUNCEONACTORS, BOUNCEONCEILINGS, BOUNCEONFLOORS, BOUNCEONUNRIPPABLES, BOUNCEONWALLS, CANBOUNCEWATER, DONTBOUNCEONSHOOTABLES, DONTBOUNCEONSKY, EXPLODEONWATER, MBFBOUNCER, NOBOUNCESOUND, NOWALLBOUNCESND, USEBOUNCESTATE }
	Deprecated = { MISSILEEVENMORE, MISSILEMORE }
}

// One short line per flag, shown when the mouse is over it in the
// constructor. A flag that isn't listed here simply has no note.
descriptions
{
	ABSMASKANGLE = "With MASKROTATION, this makes the allowed viewing angle an absolute world angle instead of one measured from the actor's own facing.";
	ABSMASKPITCH = "With MASKROTATION, this makes the allowed viewing pitch absolute instead of measured from the actor's own pitch.";
	ABSVIEWANGLES = "The ViewAngle, ViewPitch and ViewRoll values become absolute instead of offsetting from the actor's own angles.";
	ACTIVATEIMPACT = "When this projectile slams into a wall it can set off G1 or GR specials there, like a rocket punching a switch.";
	ACTIVATEMCROSS = "Lets this actor trigger monster-crosses lines when it moves over them. The Monster property sets it automatically.";
	ACTIVATEPCROSS = "Lets a projectile set off projectile-crosses lines as it flies over them. Comes with the Projectile property combo.";
	ACTLIKEBRIDGE = "Uses bridge collision logic: everything can pass above and below this actor no matter what CANPASS says.";
	ADDITIVEPOISONDAMAGE = "Poison hits add up instead of resetting, so each new hit raises the per tick damage on a victim already poisoned. Needs a PoisonDamage value.";
	ADDITIVEPOISONDURATION = "Poison from repeated hits stacks in time instead of restarting, keeping the victim poisoned longer. Needs a PoisonDamage value.";
	ADDLIGHTLEVEL = "The actor's LightLevel is added on top of the light level of the sector it stands in, instead of replacing that value.";
	AIMREFLECT = "Works with REFLECTIVE so that a bounced shot is turned around and aimed straight back at whoever fired it.";
	ALLOWBOUNCEONACTORS = "Missile bounces off actors that do not bleed. Also required before BOUNCEONACTORS does anything.";
	ALLOWPAIN = "Actor still plays its pain animation when hurt, even while invulnerable or when the damage gets absorbed. Needs incoming damage above zero.";
	ALLOWPARTICLES = "For a puff or blood actor: lets the engine swap the sprite effect for small particles when detail settings allow it.";
	ALLOWTHRUBITS = "Turns the ThruBits setting on for this actor. Without the flag any ThruBits value it has does nothing.";
	ALLOWTHRUFLAGS = "Only useful on puff actors: makes THRUACTORS, THRUSPECIES and THRUGHOST work for bullet and rail puffs.";
	ALWAYSFAST = "Monster skips the random pause before attacking and halves its Fast state timings, so it always fights at Nightmare speed.";
	ALWAYSPUFF = "Bullet and melee puffs appear even when nothing was hit, using their Crash state. Rail puffs get XDeath on bleeding victims.";
	ALWAYSRESPAWN = "A monster with this flag respawns at any skill level, as if Nightmare were on. Inventory items use the AlwaysRespawn property instead.";
	ALWAYSTELEFRAG = "This actor gets telefragged unconditionally whenever something teleports into its spot, even if the teleporter lacks TELESTOMP.";
	AMBUSH = "Wakes only when it directly sees the player, not from weapon noise. Editors often call this Deaf, but the monster still hears.";
	AVOIDHAZARDS = "The monster steps aside to dodge crushing ceilings. Nothing else is avoided, so other level hazards still hurt it.";
	AVOIDMELEE = "Monster backs away from a target that gets too close and keeps its distance, but only if it has a Missile state to fire from.";
	BILLBOARDFACECAMERA = "Makes a billboarded sprite turn to look straight at the camera position, overriding the matching console setting.";
	BILLBOARDNOFACECAMERA = "Makes a billboarded sprite ignore the camera position and face the opposite way along the view, overriding the console setting.";
	BLASTED = "Engine marker for the brief impact damage a blast effect deals, such as Hexen's Disc of Repulsion. Not useful in definitions.";
	BLOCKASPLAYER = "A non-player actor, including projectiles, is blocked by the same linedefs that stop players.";
	BLOCKEDBYSOLIDACTORS = "Solid actors block this one even if it is not solid itself. Without CANPASS, solid things act infinitely tall to it.";
	BLOODLESSIMPACT = "No blood appears when this missile hits something. On a hitscan puff it also stops bullets from spawning blood.";
	BLOODSPLATTER = "Spawns extra blood splatter sprites whenever this projectile or hitscan attack hits something that bleeds.";
	BOSS = "Marks a boss: See and Death sounds play at full volume, and boss-only items like banishment or poison bolts only partly work.";
	BOSSDEATH = "Makes A_FreezeDeathChunks and A_Burst also call A_BossDeath, so a boss end-level trigger still fires.";
	BOUNCEAUTOOFF = "Missile quits bouncing once it is moving too slowly after a bounce, and always quits on a ceiling hit.";
	BOUNCEAUTOOFFFLOORONLY = "Missile only quits bouncing when its speed after a floor bounce drops too low, other surfaces are unaffected.";
	BOUNCELIKEHERETIC = "Missile bounces just once and never off walls, like Heretic's mace balls.";
	BOUNCEONACTORS = "Missile ricochets off every actor it hits, even bleeding monsters, as long as ALLOWBOUNCEONACTORS is set too.";
	BOUNCEONCEILINGS = "Missile ricochets off ceilings, bouncing back down when it flies up into one.";
	BOUNCEONFLOORS = "Missile ricochets off floors instead of dying on them. All three bounce types imply this.";
	BOUNCEONUNRIPPABLES = "A ripping missile bounces off shootable actors flagged DONTRIP instead of being stopped by them.";
	BOUNCEONWALLS = "Missile ricochets off walls. Prefer the BounceType property over bounce flags, since it is a shortcut for them.";
	BRIGHT = "Draws every frame of the actor at full brightness, ignoring the light level of the sector around it.";
	BUDDHA = "Actor always keeps 1 health against normal attacks, it only takes damage. FOILBUDDHA hits, telefrags and instakills can still kill it.";
	BUMPSPECIAL = "Triggers the actor's special when a player touches it, with the player as activator. The Activation property can change this.";
	CAMFOLLOWSPLAYER = "For actors used as cameras: the view moves smoothly with the player camera every rendered frame, not just every game tic.";
	CANBLAST = "Hexen's Disc of Repulsion can blow this actor around with its blast. Monsters get this behavior anyway.";
	CANBOUNCEWATER = "Lets a bouncing missile skip off water and other liquids instead of vanishing when it lands.";
	CANNOTPUSH = "Can't shove pushable actors out of the way.";
	CANPASS = "Collides with other actors by height, so it can stand on them instead of passing through. Goes with SOLID.";
	CANPUSHWALLS = "Walking into a wall triggers P1/PR lines.";
	CANTLEAVEFLOORPIC = "Won't step into a sector with a different floor texture.";
	CANTSEEK = "Seeking missiles cannot lock on to this actor while flying past it.";
	CANUSEWALLS = "Opens unlocked doors and raises switches it walks into.";
	CASTSPRITESHADOW = "Forces the actor to drop a sprite shadow on the ground, even a decoration, when the shadow setting allows it.";
	CAUSEPAIN = "Hits from this attack always roll the victim's PainChance, even at zero damage or against INVULNERABLE actors.";
	CEILINGHUGGER = "Projectile travels along the ceiling.";
	CORPSE = "Marks the actor as a corpse. Rarely needed in definitions, but useful together with the Crash state.";
	COUNTITEM = "Counts toward the item percentage shown at the end of the level. Runtime changes need A_ChangeCountFlags.";
	COUNTKILL = "Counts toward the kill percentage at the end of the level. Monsters get it by default, runtime changes need A_ChangeCountFlags.";
	COUNTSECRET = "Counts toward the secret percentage shown at the end of the level. Runtime changes need A_ChangeCountFlags.";
	CROSSLINECHECK = "Lets the CanCrossLine() virtual decide whether a line may be crossed.";
	DECOUPLEDANIMATIONS = "Lets a 3D model, such as an IQM model, play several named animations at the same time instead of just one.";
	DEFLECT = "Used with REFLECTIVE. Reflected shots bounce off at a fixed 45 degree angle to either side instead of a random one.";
	DEHEXPLOSION = "Draws this missile's death burst with the translucent or glowing look chosen by the old DeHackEd explosion settings.";
	DOHARMSPECIES = "Lets the victim take impact damage from shots fired by monsters of its own species. Only affects damage received, and does nothing for hitscan.";
	DONTBLAST = "The Disc of Repulsion cannot push this actor away, the opposite of CANBLAST.";
	DONTBOUNCEONSHOOTABLES = "A bouncing missile explodes on monsters and players instead of ricocheting off them.";
	DONTBOUNCEONSKY = "A bouncing missile disappears when it reaches the sky instead of bouncing off it.";
	DONTCORPSE = "A killed monster does not become a corpse right away, so it stays solid and keeps playing its death animation.";
	DONTDRAIN = "Health cannot be siphoned away by draining attacks like Heretic's gauntlets or lifesteal punches and saws.";
	DONTFACETALKER = "The actor does not turn around to face the player while conversation dialogue is playing.";
	DONTFALL = "Stays at its height when killed instead of dropping to the ground.";
	DONTFOLLOWPLAYERS = "A friendly monster with this flag stops trailing the player once it has nothing left to fight.";
	DONTGIB = "Crushing ceilings and doors cannot squash this actor into a blood mess. Dropped items with it are not crushed away either.";
	DONTHARMCLASS = "Stops its splash damage from hurting same-class monsters, itself included. Implied by DONTHARMSPECIES, and no effect on hitscan.";
	DONTHARMSPECIES = "Same idea as DONTHARMCLASS but matched by species instead of class, so its blasts never hurt its own species. Implies DONTHARMCLASS.";
	DONTINTERPOLATE = "Stops smooth blending of the actor's movement, so it jumps from one game tic position to the next instead of sliding.";
	DONTMORPH = "Cannot be morphed into a chicken, a pig or any other morph form.";
	DONTOVERLAP = "Two of these can never share the same spot. Skips part of the collision code, so use it only when nothing else will do.";
	DONTREFLECT = "This shot never bounces off REFLECTIVE actors, it explodes on them instead while keeping its original shooter.";
	DONTRIP = "Ripping projectiles cannot pass through this actor. They die on contact as if the ripper never existed.";
	DONTSEEKINVISIBLE = "A homing missile with this flag will not lock on to or chase invisible targets.";
	DONTSPLASH = "This actor never kicks up liquid splash effects when moving through terrain liquids.";
	DONTSQUASH = "Can't be killed instantly by Heretic's upgraded mace.";
	DONTTHRUST = "Takes no knockback from damage or explosions, and pushes nothing itself.";
	DONTTRANSLATE = "Stops color translation when the actor is used as blood or spawned by another actor. Only checked when it spawns.";
	DORMANT = "The actor stays inactive at map start and takes no damage until a script wakes it with Thing_Activate.";
	DOSHADOWBLOCK = "Shots fired by this actor aim badly whenever a SHADOWBLOCK actor, such as smoke, stands in the line of fire.";
	DROPOFF = "Walks off ledges and down steps rather than being blocked by them.";
	DROPPED = "The actor always acts like a dropped item: it never respawns, and doors or moving sectors crush it unless it has DONTGIB.";
	E1M8BOSS = "Doom E1M8 boss counter: when all flagged actors die on E1M8, the end sequence lowering floors tagged 666 starts.";
	E2M8BOSS = "Doom E2M8 boss counter: when all flagged actors die on E2M8, the level ends by itself.";
	E3M8BOSS = "Doom E3M8 boss counter: when all flagged actors die on E3M8, the level ends, just like on E2M8.";
	E4M6BOSS = "E4M6 boss counter: when all actors with this flag die, all sectors tagged 666 open quickly.";
	E4M8BOSS = "E4M8 boss counter: when all actors with this flag die, floors tagged 666 lower to the closest floor.";
	EXPLOCOUNT = "A missile that would explode only does so when its special2 value has grown larger than its special1 value.";
	EXPLODEONWATER = "A bouncing missile that hits water or other liquid explodes instead of just vanishing.";
	EXTREMEDEATH = "Anything killed by this projectile or puff always blows apart into gibs, no matter how it dies.";
	FALLDAMAGE = "A long fall can hurt this monster.";
	FIXMAPTHINGPOS = "Shifts the thing out of walls when the map loads, meant for torches and similar things placed right on a wall.";
	FLATSPRITE = "Draws the sprite like a flat, so it can be tilted with the actor's pitch. Cannot be combined with WALLSPRITE.";
	FLIPSPRITEOFFSETX = "Mirrors the sprite sideways but keeps its horizontal and vertical offsets in the same relative position.";
	FLIPSPRITEOFFSETY = "Mirrors the sprite top to bottom but keeps its horizontal and vertical offsets in the same relative position.";
	FLOAT = "Changes height on its own to reach its target, at the FloatSpeed rate. Needs NOGRAVITY to work.";
	FLOATBOB = "Bobs up and down like the Heretic and Hexen power-ups. Usually set with NOGRAVITY.";
	FLOORCLIP = "Bottom is clipped away when it stands in a liquid that TERRAIN defines.";
	FLOORHUGGER = "Projectile skims the floor, passing over obstacles until it meets a real wall.";
	FOILBUDDHA = "Bypasses BUDDHA so the last hit point can be removed. Damage factors and types still apply, and players are unaffected.";
	FOILINVUL = "This attack can hurt and get the attention of INVULNERABLE monsters. It does nothing to players.";
	FORCEDECAL = "On a puff actor, the decal it carries is used on walls instead of the decal set by the weapon that fired.";
	FORCEINFIGHTING = "The monster still turns on other monsters that hurt it, even if the map has infighting switched off.";
	FORCEPAIN = "Victims always flinch when hit by this attack, even at zero damage. PAINLESS wins over it, and NOPAIN actors never flinch.";
	FORCERADIUSDMG = "Its splash damage reaches everyone, even actors normally immune to blasts such as NORADIUSDMG monsters and bosses.";
	FORCESECTORDAMAGE = "Forces it to take damaging floor harm like a player, even in sectors not set to hurt non-players. Removed in newer GZDoom versions.";
	FORCEXYBILLBOARD = "Old compatibility flag: in the 3D renderer the sprite turns on both axes to face the view, no effect in software.";
	FORCEYBILLBOARD = "Old compatibility flag: in the 3D renderer the sprite turns on the vertical axis only to face the view, no effect in software.";
	FORCEZERORADIUSDMG = "Lets even zero splash damage reach the actor damage code, so the shot can still run its DoSpecialDamage handling.";
	FRIENDLY = "Monster sides with the player and attacks other monsters instead. Changing the flag mid-game does nothing until its target is cleared.";
	FRIGHTENED = "Monster runs away from the player but still fights back when cornered.";
	FRIGHTENING = "Monsters carrying this flag run away from a target that also has it, and they attack that target less often.";
	FULLVOLACTIVE = "The actor's active sound always plays at full volume instead of fading out with distance.";
	FULLVOLDEATH = "The death sound plays at full volume without distance fade, for an exploding projectile or a monster that screams.";
	FULLVOLSEE = "The actor's see sound plays at full volume no matter how far away the listener is.";
	GETOWNER = "Only useful with FastProjectiles: the spawned actor stores the original shooter as its owner for correct damage credit.";
	GHOST = "Counts as a ghost: several Heretic weapons and projectiles can't hit it.";
	GRENADETRAIL = "Leaves a grenade smoke trail behind the actor, spawning a smoke puff every eight tics. Ignored with ROCKETTRAIL.";
	HARMFRIENDS = "A friendly monster with this flag hurts other friendly monsters of its own species with its shots, which normally pass harmlessly.";
	HITMASTER = "A projectile that dies by hitting an actor sets that actor as its master pointer. Helps bouncing missiles, bullets and rails.";
	HITOWNER = "Lets a projectile collide with its own shooter instead of passing through, so it can detonate at once and hurt the shooter. Use with care.";
	HITTARGET = "A projectile that dies by hitting an actor sets that actor as its target pointer. Helps bouncing missiles, bullets and rails.";
	HITTRACER = "A projectile that dies by hitting an actor sets that actor as its tracer pointer. Helps bouncing missiles, bullets and rails.";
	ICECORPSE = "Marks the actor as a frozen corpse, the ice-shelled remains left when a monster is frozen solid.";
	ICESHATTER = "Any damage this actor deals can shatter frozen ice corpses, whatever the damage type. The blow that first freezes someone does not count.";
	INCOMBAT = "Strife dialog flag. The actor ignores the player's attempts to talk even with a ConversationID set, usually turned on at runtime.";
	INFLOAT = "Stops a FLOAT actor from matching its target's height. Cleared after every step.";
	INTERPOLATEANGLES = "Blends the actor's angle, pitch and roll smoothly over one game tic instead of snapping to the new values.";
	INVISIBLE = "Hides the sprite and also stops monsters from noticing the actor, going further than a plain invisible render style.";
	INVISIBLEINMIRRORS = "The actor is not drawn in mirrors at all, but it is still visible in the ordinary view.";
	INVULNERABLE = "Blocks normal damage and pain. FOILINVUL shots and raw damage above one million still get through. Pair with ALLOWPAIN to still see pain.";
	ISMONSTER = "The engine classes this actor as a monster. The Monster property combo already sets it for you.";
	ISOMETRICSPRITES = "Tilts and stretches the sprite so it keeps facing the view while staying inside the actor's collision box, for isometric mode.";
	ISPUFF = "Marks the actor as a hitscan puff. It is read only, set automatically when a puff attack spawns it, and links DamageSource to the attacker.";
	JUMPDOWN = "Jumps off high ledges to close in on a target that is near.";
	JUSTATTACKED = "Internal AI marker meaning the monster must take at least one step before it may attack again. Not for use in definitions.";
	JUSTHIT = "Internal AI marker set when the actor is hurt, making it try to strike back at once. Not useful in a definition.";
	LAXTELEFRAGDMG = "Huge telefrag-style damage gets scaled by damage factors as usual instead of ignoring them. INVULNERABLE and BUDDHA are still foiled.";
	LOOKALLAROUND = "Sight checks cover every direction, not just the front arc, so A_Look can find targets beside or behind the monster.";
	MAP07BOSS1 = "MAP07 boss part 1: when all actors with this flag die, floors tagged 666 lower to the closest floor.";
	MAP07BOSS2 = "MAP07 boss part 2: when all actors with this flag die, floors tagged 667 raise by the height of the lowest texture.";
	MASKROTATION = "Shows the sprite only at angles you list with the VisibleAngles and VisiblePitch properties.";
	MASTERNOSEE = "The actor set as this one's master cannot see it in its own view, mirrors or portals, though other cameras still draw it.";
	MBFBOUNCER = "MBF style bouncer: counts as a missile for movement checks even without the flag, and keeps bouncing as it slows.";
	MINVISIBLE = "Monsters treat this actor as invisible no matter how it is drawn, so they cannot normally spot or aim at it.";
	MIRRORREFLECT = "Used with REFLECTIVE. Bounced shots turn fully around and fly back at the same speed. Overrides SHIELDREFLECT and DEFLECT.";
	MISSILE = "Marks the actor as a projectile: it dies on walls and solid actors, can bounce, and crosses lines that block monsters.";
	MISSILEEVENMORE = "Old flag, replaced by MissileChanceMult 0.125. Made monsters much keener on missile attacks at long range.";
	MISSILEMORE = "Old flag, replaced by MissileChanceMult 0.5. Raised the odds of a monster using its missile attack when far away.";
	MOVEWITHSECTOR = "Follows sector height changes even when NOBLOCKMAP would leave it behind.";
	MTHRUSPECIES = "For a missile or puff: the shot passes through actors of the species of whoever fired it.";
	MVISBLOCKED = "Left out of monster sight checks completely, so nothing ever spots it by sight.";
	NEVERFAST = "Monster always pauses a random number of steps before attacking, so it never speeds up on Nightmare or with fast monsters.";
	NEVERRESPAWN = "This monster never respawns, not even on Nightmare skill. Use it for monsters that should stay dead for good.";
	NEVERTARGET = "Nothing may target this actor at all. Unlike NOTARGET this also keeps friendly monsters from picking it up.";
	NOBLOCKMAP = "Nothing can run into or hitscan this object, though it can still collide with others. Call A_ChangeLinkFlags(0) to undo at runtime.";
	NOBLOCKMONST = "Walks through lines that are set to block monsters.";
	NOBLOOD = "No blood appears when it is hurt, and poison bolts cannot kill it. Use the BloodType property to change blood instead of removing it.";
	NOBLOODDECALS = "The actor still sprays blood sprites when hit but leaves no blood marks on walls or floors. Redundant with NOBLOOD.";
	NOBOSSRIP = "A ripping projectile with this flag cannot pass through monsters that have the BOSS flag.";
	NOBOUNCESOUND = "Bouncing missile plays no bounce sound on any surface at all.";
	NOCLIP = "No collision at all, so it moves through walls and floors.";
	NODAMAGE = "All damage becomes zero, yet it still reacts to being hit and can start infighting. Even MDK, telefrags and FOILINVUL fail against it.";
	NODAMAGETHRUST = "Doesn't shove its victim away when it deals damage.";
	NODECAL = "A puff with this flag makes the whole attack leave no mark at all on walls or other level geometry.";
	NODROPOFF = "Tall drop-offs stop it dead, as they normally do only to monsters.";
	NOEXPLODEFLOOR = "The missile just stops and dies when it lands on the floor instead of detonating.";
	NOEXTREMEDEATH = "Victims killed by this projectile or puff never explode into gibs, they use their normal death instead.";
	NOFEAR = "Frightener powerups and the anubis cheat cannot make this actor panic.";
	NOFORWARDFALL = "Damage won't topple it forward off a ledge. Can be set on the inflictor instead, to apply only to its attacks.";
	NOFRICTION = "Ignores floor friction entirely, including the speed limit in water.";
	NOFRICTIONBOUNCE = "Doesn't bounce off walls when it slides on a slippery floor.";
	NOGRAVITY = "Not affected by gravity, so it keeps the height it spawned at.";
	NOICEDEATH = "Can't be frozen solid, so it never turns into an ice corpse instead of dying.";
	NOINFIGHTING = "This actor never turns hostile against another monster, no matter what damage it takes from it.";
	NOINFIGHTSPECIES = "Being hit by a monster of its own species will not make this actor fight back against them.";
	NOINTERACTION = "The actor is pure decoration and ignores all physics, walls and other actors, and AI skips it. Restoring solidity needs A_ChangeLinkFlags.";
	NOKILLSCRIPTS = "The actor never runs KILL type ACS scripts on death, even if ForceKillScripts is enabled in GameInfo.";
	NOLIFTDROP = "Doesn't fall when the lift under it lowers.";
	NOMENU = "A player class with this flag does not appear in the class selection menu at all.";
	NONSHOOTABLE = "Nothing can hit it: projectiles pass straight through as if it were not there.";
	NOPAIN = "The actor never plays its pain animation. This even beats an attacker's ForcePain flag, but it still takes the damage.";
	NORADIUSDMG = "Immune to explosive splash damage. Direct hits still hurt it. An attacker with FORCERADIUSDMG overrides this.";
	NOSAVEGAME = "The actor is not written to savegames and will be gone after loading one. Only sensible on non-interactive actors.";
	NOSECTOR = "The actor is unlinked from its sector, turning it invisible and skipping some physics checks. Avoid it, INVISIBLE is the better choice.";
	NOSECTORDAMAGE = "Damaging floors and other sector harm cannot hurt this actor. Removed in newer GZDoom versions.";
	NOSHIELDREFLECT = "This projectile will not bounce off actors using SHIELDREFLECT, it explodes on them instead. THRUREFLECT still takes priority.";
	NOSKIN = "For player classes: this actor ignores player skins, so the standard artwork is always used.";
	NOSPLASHALERT = "Terrain sounds, such as someone landing in or wading through liquid, do not alert this monster.";
	NOSPRITESHADOW = "The actor never casts a sprite shadow, whatever the shadow setting says. Cannot be used to disable player shadows.";
	NOTARGET = "Hostile monsters will not pick this actor as a target. Friendly ones still may, use NEVERTARGET to block that too.";
	NOTARGETSWITCH = "The monster keeps its current target and only looks for a new one after that target dies.";
	NOTAUTOAIMED = "Autoaim ignores this actor, so shots are not tilted up or down to hit it. Forcing cl_doautoaim on overrides that.";
	NOTDMATCH = "This actor is not spawned in deathmatch games at all. Use it for things that should only appear in other modes.";
	NOTELEFRAG = "Nothing can ever teleport into this actor's spot, the move simply fails. Covers teleports only, not telefrag style damage.";
	NOTELEOTHER = "The actor cannot be teleported away by Hexen's banishment device item.";
	NOTELEPORT = "The actor cannot teleport at all. Projectiles get this flag automatically.";
	NOTELESTOMP = "This actor never crushes what stands where it lands when teleporting, even if the map allows monster telefrags. Also applies to Icon of Sin cubes.";
	NOTIMEFREEZE = "Keeps acting normally while time freeze powerups or the freeze cheat hold everything else still.";
	NOTONAUTOMAP = "The actor stays hidden on the automap even while a scanner powerup is active, but cheat codes still reveal it.";
	NOTRIGGER = "Disables all line special triggering for this actor, including crossing, impacting and using lines.";
	NOVERTICALMELEERANGE = "Melee range checks ignore the height difference, so the monster can strike targets far above or below itself.";
	NOWALLBOUNCESND = "Bouncing missile stays silent on wall hits, where its see sound would normally play.";
	OLDRADIUSDMG = "Uses the classic radius damage math of barrels and the boss brain, which ignores height differences when checking splash range.";
	ONLYSLAMSOLID = "A charging actor with this flag crashes only into solid or shootable things, ignoring items and other non-solid actors.";
	ONLYVISIBLEINMIRRORS = "The actor can only be seen reflected in a mirror, and is completely hidden in the ordinary view.";
	PAINLESS = "Victims never flinch when hit by this attack, no matter the damage. Overrides FORCEPAIN, but they still take the damage.";
	PICKUP = "Decides whether this class may pick up items. Mainly used to keep morphed players from collecting things.";
	PIERCEARMOR = "Armor cannot reduce the damage dealt by this projectile, the victim takes it in full.";
	POISONALWAYS = "Poisons the victim even if it is INVULNERABLE. Does nothing to the Hexen style poison that only affects players.";
	PUFFGETSOWNER = "A puff or blood splash stores its cause in the target pointer: the shooter for puffs, the bleeding actor for blood.";
	PUFFONACTORS = "Bullet and melee puffs enter their XDeath state when they strike a bleeding actor. Rail puffs need ALWAYSPUFF for this.";
	PUSHABLE = "Can be pushed around by other actors.";
	QUICKTORETALIATE = "Ignores the usual Threshold lock on its target, so the monster instantly spins on whoever just annoyed it.";
	RANDOMIZE = "Randomly shortens a projectile's first spawn and death frames by up to 3 tics. Most Doom projectiles use this.";
	REFLECTIVE = "Bounces incoming shots off at a random angle as if this actor fired them. Add DEFLECT, SHIELDREFLECT or MIRRORREFLECT to control the bounce.";
	RELATIVETOFLOOR = "Keeps its height above a moving floor while not being pulled down by gravity.";
	RETARGETAFTERSLAM = "A charging monster goes to its Idle state, not See, after slamming into something, letting lost souls re-pick a target.";
	RIPPER = "Passes through victims, dealing its damage repeatedly while inside them, so keep damage low. Never reflectable, and DONTRIP actors stop it.";
	ROCKETTRAIL = "Leaves a rocket smoke trail behind the actor, spawning a smoke puff actor at its position every four tics.";
	ROLLCENTER = "Rolls the sprite around its own center rather than around its offsets, giving the older behavior.";
	ROLLSPRITE = "The sprite tips over together with the view roll instead of always staying upright.";
	SCREENSEEKER = "A homing missile may only switch to a target sitting inside about an 84 degree cone in front of whoever fired it.";
	SEEFRIENDLYMONSTERS = "A hostile monster with this flag attacks friendly monsters on sight, using the same sight rules friendly ones use.";
	SEEINVISIBLE = "The monster can see and aim at invisible actors with no loss of accuracy at all.";
	SEEKERMISSILE = "Marks a homing missile: it locks onto its owner's target when fired and needs a seeker movement state to steer at it.";
	SEESDAGGERS = "Strife only: the monster notices dagger hits that normally alert nobody. Clear it to keep Acolytes from reacting to stabbing.";
	SHADOW = "Monsters aiming at this actor become inaccurate. It does not make the sprite see-through, that needs a render style.";
	SHADOWAIM = "Monsters that can see invisible foes still aim poorly at SHADOW actors when this flag is on.";
	SHADOWAIMVERT = "Also ruins a monster's vertical aim when it shoots at SHADOW actors or through SHADOWBLOCK ones.";
	SHADOWBLOCK = "Standing in someone's line of fire, this actor makes attackers with DOSHADOWBLOCK aim badly, as if the target had SHADOW.";
	SHIELDREFLECT = "Used with REFLECTIVE. Only shots arriving from the front are bounced, at a fixed 45 degree angle either side.";
	SHOOTABLE = "The object can be damaged; once its health drops below zero it enters its death state.";
	SKULLFLY = "Charging mode set by A_SkullAttack: the actor keeps its speed, hurts what it hits, skips pain, and clears on impact.";
	SKYEXPLODE = "A projectile detonates when it hits the sky instead of vanishing. A puff with this flag appears on horizon lines.";
	SLIDESONWALLS = "Slides along a wall instead of stopping dead against it.";
	SMASHABLE = "Breaks apart if it falls even a short height onto the floor, like Hexen's pottery decorations.";
	SOLID = "The actor blocks other actors horizontally, sized by its radius and height. Add CANPASS for height sensitive blocking.";
	SPAWNCEILING = "The actor spawns hanging from the ceiling instead of standing on the floor. Use it together with NOGRAVITY.";
	SPAWNFLOAT = "Spawns at a random height within its sector.";
	SPAWNSOUNDSOURCE = "The projectile plays its see sound from the actor that fired it instead of from its own position.";
	SPECIAL = "Tells the engine this actor can be picked up. Inventory classes get it automatically, and unsetting it there does nothing.";
	SPECIALFIREDAMAGE = "A projectile with this flag that deals fire damage will not trigger the fiery death animation when it kills.";
	SPECIALFLOORCLIP = "Terrain doesn't adjust its floorclip, so it can rise out of the floor like the buried reaver.";
	SPECTRAL = "Only projectiles or puffs that also carry SPECTRAL can hurt this monster, and only bullet style attacks, not rails.";
	SPRITEANGLE = "Lets the SpriteAngle property take effect, so the sprite can face another way than the actor itself does.";
	SPRITEFLIP = "Mirrors the sprite sideways in a special way. Does nothing if the sprite frame shown is already a mirrored pair.";
	SQUAREPIXELS = "Draws the sprite without aspect ratio correction, so its pixels stay square like on particles and rolling sprites.";
	STANDSTILL = "An inactive monster stays put instead of pacing around while it has nothing to attack. Used by Strife humanoids and friendly monsters.";
	STAYMORPHED = "A morphed actor with this flag can never change back to its normal form. Does not work on player classes.";
	STAYONLIFT = "Stands still on a moving platform and starts walking again once it stops.";
	STEALTH = "The monster is invisible to everything except while it is being hurt or attacking, then it shows normally.";
	STEPMISSILE = "Lets a missile climb small steps and ledges while flying instead of being stopped by them.";
	STOPRAILS = "Piercing rail shots halt at this actor instead of passing through, though the actor still takes the rail hit.";
	STRETCHPIXELS = "Always applies aspect ratio correction to the sprite, even while the actor is rolling.";
	STRIFEDAMAGE = "Applies Strife's softer projectile math: the damage is scaled by a random value from 1 to 4, so hits average lower.";
	SUMMONEDMONSTER = "Only useful for Minotaur and derivatives: it slightly changes class functions like A_MinotaurDecide, and only MinotaurFriend uses it.";
	SYNCHRONIZED = "Removes the small random offset level-start actors get, so all copies of this actor animate in lockstep.";
	TELEPORT = "Set only for the moment an actor is being teleported while its destination is checked for a collision. Not for definitions.";
	TELESTOMP = "Lets this actor crush whatever stands where it teleports. Without it, a teleport onto another actor simply fails.";
	THRUACTORS = "Passes straight through every other actor.";
	THRUGHOST = "Missiles and puffs pass through GHOST actors. A puff also needs ALLOWTHRUFLAGS.";
	THRUREFLECT = "Used with REFLECTIVE. Bounced shots pass straight through at the same speed yet still count as reflected. Overrides all other reflect styles.";
	THRUSPECIES = "Passes through actors that share its Species.";
	TOUCHY = "The actor dies at the slightest touch: bumping another actor, a ceiling or door closing on it, a fall, or a blast effect.";
	USEBOUNCESTATE = "Bouncing missile switches to its Bounce state on impact, with variants for floors, ceilings, walls, and actors.";
	USEKILLSCRIPTS = "When this actor dies, any ACS script of the KILL type set for it will be executed.";
	USESPECIAL = "Pressing use while facing this actor triggers its special and counts the player as the activator. The Activation property alters this.";
	VISIBILITYPULSE = "Makes the actor's see-through level pulse steadily from about a quarter transparent all the way to fully solid.";
	VULNERABLE = "Lets area and splash damage affect this actor even when it is not SHOOTABLE, which normally keeps it safe from blasts.";
	WALLSPRITE = "Like FLATSPRITE for wall-mounted art, but the sprite ignores the actor's pitch. Cannot be combined with FLATSPRITE.";
	WEAPONSPAWN = "Marks a spawned weapon pickup so the coop weapon spawn filter can suppress it. Weapons inherit this.";
	WINDTHRUST = "Is blown about by Heretic and Hexen wind specials and by point pushers and pullers.";
	XFLIP = "Mirrors the sprite sideways, so a monster drawn facing left now appears facing right.";
	YFLIP = "Mirrors the sprite top to bottom, turning the picture upside down on screen.";
	ZDOOMTRANS = "Flags a see-through render style as a ZDoom addition, so it becomes fully opaque when the vanilla translucency setting is used.";
}
