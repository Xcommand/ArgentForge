<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Шахматный паттерн для обозначения альфа-канала (прозрачности) -->
    <pattern id="alpha-grid" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#E0E0E0"/>
      <rect x="3" width="3" height="3" fill="#FFFFFF"/>
      <rect y="3" width="3" height="3" fill="#FFFFFF"/>
      <rect x="3" y="3" width="3" height="3" fill="#E0E0E0"/>
    </pattern>
  </defs>

  <!-- Область-подложка с шахматным фоном под кончиком пипетки -->
  <rect x="2" y="14" width="8" height="8" rx="1.5" fill="url(#alpha-grid)" stroke="#B0B0B0" stroke-width="1"/>

  <!-- Основной контур и заливка пипетки -->
  <path d="M14.5 3.5a2.121 2.121 0 0 1 3 3L18 7.5L16.5 9l-1.5-1.5L6 16.5V19h2.5l8.5-8.5L18.5 12L20 10.5l-1-1a2.121 2.121 0 0 1-3-3l-1.5-1.5z" fill="#F8F9FA" stroke="#212529" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Наконечник пипетки -->
  <path d="M5.5 18.5L4 20" stroke="#212529" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Блик на резиновой части -->
  <path d="M15.5 5.5l3 3" stroke="#ADB5BD" stroke-width="1.5" stroke-linecap="round"/>
</svg>
