<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Сетка пиксель-арта на заднем плане (для контекста) -->
  <g stroke="#E0E0E0" stroke-width="0.5">
    <line x1="4" y1="4" x2="4" y2="20" />
    <line x1="8" y1="4" x2="8" y2="20" />
    <line x1="12" y1="4" x2="12" y2="20" />
    <line x1="16" y1="4" x2="16" y2="20" />
    <line x1="20" y1="4" x2="20" y2="20" />
    
    <line x1="4" y1="4" x2="20" y2="4" />
    <line x1="4" y1="8" x2="20" y2="8" />
    <line x1="4" y1="12" x2="20" y2="12" />
    <line x1="4" y1="16" x2="20" y2="16" />
    <line x1="4" y1="20" x2="20" y2="20" />
  </g>

  <!-- Лишний пиксель "буквой Г", который БЫЛ бы без Pixel Perfect (сделан полупрозрачным/удаленным) -->
  <rect x="8" y="12" width="4" height="4" fill="none" stroke="#DC3545" stroke-dasharray="1,1" stroke-width="1"/>
  <line x1="9" y1="13" x2="11" y2="15" stroke="#DC3545" stroke-width="0.75"/>
  <line x1="11" y1="13" x2="9" y2="15" stroke="#DC3545" stroke-width="0.75"/>

  <!-- Правильная, аккуратная пиксельная линия (идеальный стык) -->
  <!-- Горизонтальный пиксель -->
  <rect x="4" y="12" width="4" height="4" fill="#212529"/>
  <!-- Диагональный стык (угол) -->
  <rect x="12" y="8" width="4" height="4" fill="#212529"/>
  <!-- Вертикальный пиксель -->
  <rect x="16" y="4" width="4" height="4" fill="#212529"/>

  <!-- Зеленая галочка или маркер "идеальности" / "правильности" -->
  <path d="M5 6l2 2 4-4" fill="none" stroke="#28A745" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Инструмент рисования (карандаш пиксель-арта) в процессе создания этой линии -->
  <g transform="translate(4, -1)">
    <!-- Белая обводка карандаша -->
    <path d="M12 14l6-6 3 3-6 6-3-3z" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Корпус -->
    <path d="M12 14l6-6 3 3-6 6-3-3z" fill="#FFC107" stroke="#212529" stroke-width="1"/>
    <!-- Грифель -->
    <path d="M12 14l-2 2 3-1-1-1z" fill="#212529"/>
    <!-- Стирательная резинка -->
    <path d="M21 11l1-1-2-2-1 1 2 2z" fill="#E83E8C"/>
  </g>
</svg>
