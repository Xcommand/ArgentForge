<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Шахматный паттерн альфа-канала -->
    <pattern id="checker-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#E0E0E0"/>
      <rect x="2" width="2" height="2" fill="#FFFFFF"/>
      <rect y="2" width="2" height="2" fill="#FFFFFF"/>
      <rect x="2" y="2" width="2" height="2" fill="#E0E0E0"/>
    </pattern>
  </defs>

  <!-- Задний фон: шахматная сетка (альфа-канал) -->
  <rect x="2" y="2" width="20" height="20" rx="3" fill="url(#checker-pattern)" stroke="#CCCCCC" stroke-width="1"/>

  <!-- Силуэт кисти, которая рисует сверху -->
  <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L13 14l-4 1 1-4 8.5-8.5z" fill="#343A40" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
  <!-- Мазок/краска от кисти, показывающий, что мы "рисуем" -->
  <path d="M9 11.5L6 14.5" stroke="#343A40" stroke-width="2" stroke-linecap="round"/>

  <!-- Замок в нижнем углу, символизирующий защиту/сохранение прозрачности -->
  <g transform="translate(2, 11)">
    <!-- Белая подложка-контур для читаемости на любом фоне -->
    <rect x="1" y="4" width="9" height="7" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M2.5 4V2.5a2 2 0 0 1 4 0V4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Сам замок (акцентный цвет, например, системный синий или красный) -->
    <rect x="1" y="4" width="9" height="7" rx="1.5" fill="#007BFF"/>
    <path d="M2.5 4V2.5a2 2 0 0 1 4 0V4" fill="none" stroke="#007BFF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Замочная скважина -->
    <circle cx="5.5" cy="7.5" r="1" fill="#FFFFFF"/>
  </g>
</svg>
