<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Argent Forge - It's more than just a Doom Editor</title>
  <style type="text/css">
    @import url('base.css');

    /*#theme#*/
    
    @font-face {
      font-family: 'Fira Sans';
      src: url('FiraSans-Regular.woff');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Fira Sans';
      src: url('FiraSans-Italic.woff');
      font-weight: normal;
      font-style: italic;
    }
    
    @font-face {
      font-family: 'Fira Sans';
      src: url('FiraSans-Medium.woff');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Fira Sans';
      src: url('FiraSans-Bold.woff');
      font-weight: 700;
      font-style: normal;
    }
    
    @font-face {
      font-family: 'Fira Sans';
      src: url('FiraSans-Heavy.woff');
      font-weight: 900;
      font-style: normal;
    }

    /* These few sit outside the theme files, so they have to read on both
       backgrounds: gold and hell energy work on either */
    #topbar {
      background-color: rgb(226, 150, 70);
      width: 100%;
      height: 0.2em;
      position: fixed;
      z-index: 998;
    }

    a.link,
    img.link {
      display: inline-block;
      vertical-align: middle;
      margin-bottom: 0.2em;
    }
    
    img.link {
      margin-top: 0;
      margin-right: 0.5em;
	  margin-top: -0.2em;
	  width: 1.25em;
	  height: 1.25em;
    }

    #content a.link,
    #content img.link {
      line-height: 1em;
      padding: 0;
      /*margin: 0;*/
    }

    #content img.link {
      margin-right: 0.5em;
    }

    /* A recent file is a whole path, so it reads better a size down than wrapped.
       Only the row needs it: links and icons inherit */
    .recentbox .link {
      font-size: 0.85em;
    }
    
    #side {
      position: fixed;
      width: 17em;
      height: 100%;
      padding-top: 0.5em;
    }
    
    #side #title {
      margin: 0.6em 0 0.4em 0;
      border-radius: 0;
      padding-top: 0.2em;
      padding-bottom: 0.1em;
    }
    
    #side p {
      margin: 0 1em;
    }
    
    #side img {
      margin-bottom: 0;
    }
    
    #side img.link {
      margin-right: 0;
      margin-left: 1em;
    }
    
    #content {
      margin-left: auto;
      margin-right: auto;
      padding-left: 19em;
      padding-right: 1em;
      padding-top: 2em;
      padding-bottom: 1em;
      max-width: 51em;
    }
    
    #slade {
      font-size: 2em;
      font-weight: 900;
      margin-top: 0;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: -0.2em;
    }
    
    #version {
      font-size: 0.5em;
    }

    a.refresh {
      color: hsl(40, 40%, 92%);
    }

    a.refresh:hover {
      color: hsl(43, 85%, 70%);
    }

  </style>
</head>

<body>
  <div id="topbar"></div>

  <!-- Side Bar -->
  <div id="side">

    <!-- Logo & Version -->
    <center>
      <img src="logo_icon.png" />
      <div id="slade">
        Argent Forge
        <span id="version">v#version#</span>
      </div>
    </center>

    <!-- Get Started -->
    <div id="title">Get Started</div>
    <p>
      <div class="link">
        <img src="open.svg" class="link" />
        <a href="action://open" class="link">Open Archive</a>
      </div>
	  <div class="link">
        <img src="opendir.svg" class="link" />
        <a href="action://opendir" class="link">Open Directory</a>
      </div>
      <div class="link">
        <img src="newarchive.svg" class="link" />
        <a href="action://newarchive" class="link">Create New Archive</a>
      </div>
      <div class="link">
        <img src="mapeditor.svg" class="link" />
        <a href="action://newmap" class="link">Create New Map</a>
      </div>
    </p>

    <!-- Links -->
    <div id="title">Links</div>
    <p>
      <div class="link">
        <img src="wiki.svg" class="link" />
        <a href="https://github.com/Xcommand/ArgentForge" class="link">GitHub</a>
      </div>
      <div class="link">
        <img src="wiki.svg" class="link" />
        <a href="https://github.com/Xcommand/ArgentForge/blob/HEAD/docs/user/README.md" class="link">User Guide</a>
      </div>
      <div class="link">
        <img src="wiki.svg" class="link" />
        <a href="https://github.com/Xcommand/ArgentForge/wiki" class="link">Documentation</a>
      </div>
      <div class="link">
        <img src="wiki.svg" class="link" />
        <a href="http://slade.mancubus.net" class="link">Original SLADE</a>
      </div>
    </p>

    <!-- Tip of the Day -->
    <div id="title">Tip of the Day<span style="float: right; padding-top: 0.1em;"><a href="action://reloadstartpage" class="refresh">&#x21bb;</a></span></div>
    <p>
      #totd#
    </p>
  </div>

  <!-- Content -->
  <div id="content">

    <!-- Recent Files -->
    <div id="back" class="recentbox">
      <div id="title">Recent Files</div>
      #recent#
    </div>

    <!-- Latest News Post -->
    #news#
  </div>
</body>

</html>
